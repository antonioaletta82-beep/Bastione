<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bastione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --case:#bdb8ad;
  --ink:#2a2622;
  --ink-soft:#6a6358;
  --bezel:#3a393f;
  --bezel-edge:#26252a;
  --key:#2f2e33;
  --key-ink:#e2ddd1;
  --well:#232228;
  --fire:#b3261e;
  --fire-deep:#6f130d;
  --led:#e5473b;
  --font:"Silkscreen","Courier New",ui-monospace,monospace;
  --pad:clamp(150px,44vw,210px);
  --fire-size:clamp(96px,28vw,132px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --case:#2a292d; --ink:#e6e0d4; --ink-soft:#9a9489; --bezel:#141417; --bezel-edge:#050506;
    --key:#46454c; --key-ink:#ece6da; --fire:#c2372c; --fire-deep:#6f130d; --well:#101013;
  }
}
:root[data-theme="dark"]{
  --case:#2a292d; --ink:#e6e0d4; --ink-soft:#9a9489; --bezel:#141417; --bezel-edge:#050506;
  --key:#46454c; --key-ink:#ece6da; --fire:#c2372c; --fire-deep:#6f130d; --well:#101013;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--case)}
body{
  margin:0;height:100%;background:var(--case);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{
  height:100%;max-width:760px;margin:0 auto;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));
  display:grid;gap:12px;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "field field" "dpad fire";
}
#top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px}
#brand{font-size:20px;font-weight:700;color:var(--ink-soft);text-shadow:0 1px 0 rgba(255,255,255,.28);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:414px){#brand{display:none}}
#topBtns{display:flex;gap:8px;flex:none;margin-left:auto}
.chip{
  font:400 12px var(--font);color:var(--key-ink);background:var(--key);border:0;border-radius:999px;
  padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35);touch-action:manipulation
}
.chip:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.chip:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}

#fieldArea{grid-area:field;min-width:0;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#bezel{
  background:var(--bezel);padding:10px;border-radius:14px;display:flex;flex-direction:column;gap:8px;
  box-shadow:inset 0 0 0 2px var(--bezel-edge),0 1px 0 rgba(255,255,255,.22)
}
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;height:18px;color:#d9d4c8;font-size:13px;line-height:18px;white-space:nowrap}
#hud .left{display:flex;align-items:center;gap:7px}
#hud .led{width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led)}
#hudScore{color:#f2d16b}
#screen{position:relative;background:#000;border-radius:3px;overflow:hidden;--u:3px}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#reserve{display:flex;justify-content:flex-end;gap:3px;height:9px;align-items:center}
#reserve i{display:block;width:6px;height:8px;border-radius:1px;background:#9aa1ab}
#reserve i.gone{opacity:.14}

#overlay{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*3);padding:calc(var(--u)*5);text-align:center;color:#f3eee2;background:rgba(0,0,0,.86);overflow:auto
}
#overlay.show{display:flex}
#overlay.intro{background:#66625b}
#overlay h1{margin:0;font-size:calc(var(--u)*14);line-height:1;font-weight:700;color:#f2d16b;text-shadow:0 calc(var(--u)*.8) 0 #7c1812}
#overlay h2{margin:0;font-size:calc(var(--u)*8);line-height:1.05;font-weight:700}
#overlay p{margin:0;font-size:calc(var(--u)*3.8);line-height:1.4;max-width:30ch}
#overlay .dim{color:#b9b3a7}
#overlay .small{font-size:calc(var(--u)*3.2)}
#overlay .go{
  font:700 calc(var(--u)*4.6) var(--font);color:#fff;background:var(--fire);border:0;border-radius:999px;
  padding:calc(var(--u)*2.2) calc(var(--u)*7);cursor:pointer;box-shadow:0 calc(var(--u)*.9) 0 var(--fire-deep)
}
#overlay .go:active{transform:translateY(calc(var(--u)*.6));box-shadow:0 calc(var(--u)*.3) 0 var(--fire-deep)}
.legend{display:grid;grid-template-columns:repeat(3,auto);gap:calc(var(--u)*1.8) calc(var(--u)*4);list-style:none;margin:0;padding:0;font-size:calc(var(--u)*3.3)}
.legend li{display:flex;align-items:center;gap:calc(var(--u)*1.4);text-align:left}
.legend img,.tally img{width:calc(var(--u)*6);height:calc(var(--u)*6);image-rendering:pixelated;flex:none}
.tally{display:grid;grid-template-columns:auto 1fr auto auto;gap:calc(var(--u)*1.4) calc(var(--u)*3);align-items:center;font-size:calc(var(--u)*3.6);text-align:left}
.tally .row{display:contents}
.tally .num{text-align:right;color:#f2d16b}

#stickZone{grid-area:dpad;position:relative;width:100%;min-width:var(--pad);height:var(--pad);touch-action:none;display:none;--kx:0px;--ky:0px;--sx:50%;--sy:50%}
#stick{
  position:absolute;left:var(--sx);top:var(--sy);width:var(--pad);height:var(--pad);
  margin:calc(var(--pad) / -2) 0 0 calc(var(--pad) / -2);pointer-events:none
}
#stickZone:not([data-on]) #stick{opacity:.62;transition:opacity .18s ease,left .18s ease,top .18s ease}
@media (prefers-reduced-motion:reduce){#stickZone:not([data-on]) #stick{transition:opacity .18s ease}}
#stick .well{
  position:absolute;inset:0;border-radius:50%;background:var(--well);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.28)
}
#stick .tri{position:absolute;width:9%;height:9%;background:var(--key-ink);opacity:.38;pointer-events:none;transition:opacity .1s,background .1s}
#stick .t0{left:45.5%;top:4%;clip-path:polygon(50% 0,100% 100%,0 100%)}
#stick .t2{left:45.5%;bottom:4%;clip-path:polygon(0 0,100% 0,50% 100%)}
#stick .t3{top:45.5%;left:4%;clip-path:polygon(0 50%,100% 0,100% 100%)}
#stick .t1{top:45.5%;right:4%;clip-path:polygon(0 0,100% 50%,0 100%)}
#stickZone[data-dir="0"] .t0,#stickZone[data-dir="1"] .t1,#stickZone[data-dir="2"] .t2,#stickZone[data-dir="3"] .t3{background:var(--led);opacity:1}
#stick .knob{
  position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;
  background:var(--key);pointer-events:none;
  background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 52%,rgba(0,0,0,.22));
  box-shadow:0 4px 7px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.10);
  transform:translate(var(--kx),var(--ky))
}
#stick .knob::after{
  content:"";position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.20)
}
#stickZone:not([data-on]) .knob{transition:transform .13s cubic-bezier(.2,.8,.3,1)}
@media (prefers-reduced-motion:reduce){#stick .knob{transition:none!important}}
#fireWrap{grid-area:fire;justify-self:end;align-self:center;display:none;padding-right:4px}
#fire{
  width:var(--fire-size);height:var(--fire-size);border-radius:50%;border:0;background:var(--fire);color:#fff;
  font:700 13px var(--font);touch-action:none;cursor:pointer;
  box-shadow:0 6px 0 var(--fire-deep),inset 0 3px 0 rgba(255,255,255,.22)
}
#fire.down{transform:translateY(5px);box-shadow:0 1px 0 var(--fire-deep),inset 0 3px 0 rgba(255,255,255,.12)}
#hint{grid-column:1/-1;grid-row:3;margin:0;text-align:center;font-size:12px;color:var(--ink-soft)}
body.touch #stickZone{display:block}
body.touch #app{padding-bottom:clamp(30px,9vh,86px)}
body.touch #fireWrap{display:flex}
body.touch #hint{display:none}
@media (orientation:landscape){
  body.touch #app{
    max-width:none;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"top top top" "dpad field fire"
  }
  body.touch #stickZone{--pad:clamp(120px,min(26vw,46vh),200px)}
  body.touch #app{padding-bottom:12px}
  body.touch #fieldArea{align-items:center}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">Bastione</div>
    <div id="topBtns">
      <button class="chip" id="btnMute" type="button" aria-pressed="false">Audio sì</button>
      <button class="chip" id="btnAuto" type="button" aria-pressed="true">Auto sì</button>
      <button class="chip" id="btnPause" type="button" disabled>Pausa</button>
    </div>

  <main id="fieldArea">

        <span id="hudScore">000000</span>

      </div>
      <div id="screen">
        <canvas id="cv" width="832" height="832" aria-label="Campo di gioco"></canvas>
        <div id="overlay"></div>
      </div>
      <div id="reserve" aria-label="Carri nemici in arrivo"></div>
    </div>

  <div id="stickZone" aria-hidden="true"><div id="stick">
    <span class="well"></span>
    <span class="tri t0"></span><span class="tri t1"></span><span class="tri t2"></span><span class="tri t3"></span>
    <span class="knob"></span>
  </div></div>
  <div id="fireWrap"><button id="fire" type="button" aria-label="Fuoco">Fuoco</button></div>
  <p id="hint">Frecce o WASD per muovere, spazio per sparare, F per l’autofire, P per la pausa, M per l’audio.</p>
</div>

const SHAPE = {

  basic: {sw:2, sy:5, gy:3.0, gw:3.8, gh:3.0, bx:4.6, by:13.1, br:2.9},

};
function buildSprite(o, f){
  const g = [];
  for (let i = 0; i < 16; i++) g.push(new Array(16).fill('.'));
  const R = (x0, y0, x1, y1, ch) => {
    for (let y = Math.max(0, Math.round(y0)); y <= Math.min(15, Math.round(y1)); y++)
      for (let x = Math.max(0, Math.round(x0)); x <= Math.min(15, Math.round(x1)); x++) g[y][x] = ch;
  };
  const E = (cx, cy, rx, ry, ch) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[y][x] = ch;
    }
  };
  const bump = f ? 1 : 0, sw = o.sw, sy = o.sy - bump, gy = o.gy - bump;
  const br = o.br * (f ? .92 : 1), by = o.by + (f ? .5 : 0);
  for (const s of [-1, 1]) E(8 + s * o.bx, by, br, br * 1.05, 't');
  for (const s of [-1, 1]) E(8 + s * o.bx - br * .35, by - br * .45, br * .32, br * .3, 'T');
  R(8 - sw, sy, 7 + sw, 15, 'b');
  E(8, gy, o.gw, o.gh, 'g');
  const rimy = gy + o.gh - .5;
  R(8 - sw - 1, rimy, 7 + sw + 1, rimy, 'o');
  R(8 - sw, rimy + 1, 8 - sw, 13, 'h');
  E(8 - o.gw * .42, gy - o.gh * .3, o.gw * .26, o.gh * .26, 'h');
  if (o.ring) R(8 - sw - 1, rimy + 2, 7 + sw + 1, rimy + 2, 'h');
  R(7, gy - o.gh + .8, 8, gy - o.gh + .8, 'h');
  const out = g.map(r => r.slice());
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
    if (g[y][x] !== '.') continue;
    for (const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x + d[0], ny = y + d[1];
      if (nx >= 0 && nx < 16 && ny >= 0 && ny < 16 && g[ny][nx] !== '.' && g[ny][nx] !== 'o'){ out[y][x] = 'o'; break; }
    }

}

const SPLASH = {hy:1.9, hr:2.0, tail:[[3.6,4.2,1.0],[5.0,5.8,0.8],[3.4,7.2,0.6]]};
function buildSplash(){
  const g = [];
  for (let i = 0; i < 8; i++) g.push(new Array(8).fill('.'));
  const E = (cx, cy, rx, ry, ch) => {
    if (rx <= 0 || ry <= 0) return;
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++){
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[y][x] = ch;
    }
  };
  const hr = SPLASH.hr;
  E(4, SPLASH.hy, hr, hr * .95, 'o');
  E(4, SPLASH.hy, hr - .75, hr * .95 - .75, 'w');
  E(4 - hr * .3, SPLASH.hy - hr * .3, hr * .34, hr * .32, 'W');
  for (const t of SPLASH.tail){
    E(t[0], t[1], t[2], t[2], 'o');
    if (t[2] > .9) E(t[0], t[1], t[2] - .5, t[2] - .5, 'w');
  }
  return g.map(r => r.join(''));
}

const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  function init(){
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    try {
      ac = new A();
      master = ac.createGain(); master.gain.value = .6; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch(e){ ac = null; }
  }
  const ok = () => ac && !muted && ac.state === 'running';
  function tone(f, dur, type = 'square', vol = .06, to = null, delay = 0){
    if (!ok()) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .03);
  }
  function noise(dur, vol = .15, from = 1500, to = 200){
    if (!ok()) return;
    const t0 = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass';
    f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + .03);
  }
  const seq = (notes, step, type = 'square', vol = .05) => notes.forEach((n, i) => { if (n) tone(n, step * .9, type, vol, null, i * step); });
  return {
    init,
    shoot:   () => tone(720, .07, 'square', .045, 360),

    steel:   () => tone(1500, .06, 'triangle', .07, 900),

/* ---------- movimento ---------- */
function solidAt(x, y, w, h){
  const x0 = Math.floor(x / T), y0 = Math.floor(y / T), x1 = Math.floor((x + w - .001) / T), y1 = Math.floor((y + h - .001) / T);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){
    const v = cell(cx, cy);
    if (v === BRICK || v === STEEL || v === WATER) return true;
  }
  return false;
}
function blocked(t, nx, ny){
  if (nx < 0 || ny < 0 || nx + 16 > W || ny + 16 > W) return true;
  if (solidAt(nx, ny, 16, 16)) return true;
  if (overlap(nx, ny, 16, 16, BASE.x, BASE.y, 16, 16)) return true;
  for (const o of tanks){
    if (o === t || !o.alive) continue;
    if (overlap(nx, ny, 16, 16, o.x, o.y, 16, 16) && !overlap(t.x, t.y, 16, 16, o.x, o.y, 16, 16)) return true;
  }
  return false;
}
function snapAxis(t, v, isX){
  const s = Math.round(v / 8) * 8;
  if (s === v) return v;
  for (const c of [s, v < s ? s - 8 : s + 8]){
    if (Math.abs(c - v) >= 8) continue;
    if (isX ? !blocked(t, c, t.y) : !blocked(t, t.x, c)) return c;
  }
  return v;
}
function turn(t, dir){
  if (dir === t.dir) return;
  if ((dir & 1) !== (t.dir & 1)){
    if ((t.dir & 1) === 0) t.y = snapAxis(t, t.y, false);
    else t.x = snapAxis(t, t.x, true);
  }
  t.dir = dir;
}
function assist(t, dir){
  const vert = (dir & 1) === 0, cur = vert ? t.x : t.y, target = Math.round(cur / 8) * 8, dv = target - cur;
  if (dv === 0 || Math.abs(dv) > 4) return false;
  const [dx, dy] = DIRS[dir], ax = vert ? target : t.x, ay = vert ? t.y : target;
  if (blocked(t, ax, ay) || blocked(t, ax + dx, ay + dy)) return false;
  const st = Math.sign(dv) * Math.min(Math.abs(dv), t.speed);
  const nx = vert ? t.x + st : t.x, ny = vert ? t.y : t.y + st;
  if (blocked(t, nx, ny)) return false;
  t.x = nx; t.y = ny;
  return true;
}
function tryMove(t, dir){
  turn(t, dir);
  const [dx, dy] = DIRS[dir];
  let rem = t.speed, moved = false;
  while (rem > .0001){
    const st = Math.min(.5, rem), nx = t.x + dx * st, ny = t.y + dy * st;
    if (blocked(t, nx, ny)) break;
    t.x = nx; t.y = ny; rem -= st; moved = true;
  }
  if (!moved && t.isPlayer) moved = assist(t, dir);
  return moved;
}

/* ---------- proiettili ---------- */
function breakCell(c, r, power){
  const v = cell(c, r);
  if (v === BRICK || (power && v === STEEL)){ grid[r * G + c] = EMPTY; terrainDirty = true; }
}
function carve(b){
  const depth = b.power ? 2 : 1;
  if ((b.dir & 1) === 0){
    const c0 = Math.floor((b.x - 8) / T), c1 = Math.floor((b.x + 7.999) / T), step = b.dir === 0 ? -1 : 1;
    let r = b.dir === 0 ? Math.floor((b.y - 2) / T) : Math.floor((b.y + 1.999) / T);
    for (let d = 0; d < depth; d++, r += step) for (let c = c0; c <= c1; c++) breakCell(c, r, b.power);
  } else {
    const r0 = Math.floor((b.y - 8) / T), r1 = Math.floor((b.y + 7.999) / T), step = b.dir === 3 ? -1 : 1;
    let c = b.dir === 3 ? Math.floor((b.x - 2) / T) : Math.floor((b.x + 1.999) / T);
    for (let d = 0; d < depth; d++, c += step) for (let r = r0; r <= r1; r++) breakCell(c, r, b.power);
  }
}
function bulletStep(b){
  const bx = b.x - 2, by = b.y - 2;
  if (bx < 0 || by < 0 || bx + 4 > W || by + 4 > W){
    b.alive = false;
    boom(Math.max(2, Math.min(W - 2, b.x)), Math.max(2, Math.min(W - 2, b.y)), false);
    if (b.isPlayer) sfx.steel();
    return;
  }
  const x0 = Math.floor(bx / T), x1 = Math.floor((bx + 3.999) / T), y0 = Math.floor(by / T), y1 = Math.floor((by + 3.999) / T);
  let brick = false, steel = false;
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){
    const v = cell(cx, cy);
    if (v === BRICK) brick = true; else if (v === STEEL) steel = true;
  }
  if (brick || steel){
    b.alive = false; boom(b.x, b.y, false);
    if (brick || b.power) carve(b);
    if (b.isPlayer){ if (brick || b.power) sfx.brick(); else sfx.steel(); }
    return;
  }
  if (overlap(bx, by, 4, 4, BASE.x, BASE.y, 16, 16)){
    b.alive = false;
    if (baseAlive && !b.isPlayer) destroyBase(); else boom(b.x, b.y, false);
    return;
  }
  for (const t of tanks){
    if (!t.alive || t === b.owner || !overlap(bx, by, 4, 4, t.x, t.y, 16, 16)) continue;
    if (b.isPlayer && !t.isPlayer){ b.alive = false; hitEnemy(t); return; }
    if (!b.isPlayer && t.isPlayer){
      b.alive = false;
      if (t.shield > 0) boom(b.x, b.y, false); else killPlayer();
      return;
    }
  }
}
function updateBullets(){
  const SUB = 4;
  for (let s = 0; s < SUB; s++){
    for (const b of bullets){
      if (!b.alive) continue;
      b.x += DIRS[b.dir][0] * b.speed / SUB;
      b.y += DIRS[b.dir][1] * b.speed / SUB;
      bulletStep(b);
    }
    for (let i = 0; i < bullets.length; i++){
      const a = bullets[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < bullets.length; j++){
        const c = bullets[j];
        if (!c.alive || a.isPlayer === c.isPlayer) continue;
        if (overlap(a.x - 2, a.y - 2, 4, 4, c.x - 2, c.y - 2, 4, 4)){ a.alive = false; c.alive = false; break; }
      }
    }
  }
  bullets = bullets.filter(b => b.alive);
}

  sfx.boom();
  if (scored){
    const pts = ENEMY[e.type].pts;
    addScore(pts); kills[e.type]++;
    popups.push({x:e.x + 8, y:e.y + 8, text:String(pts), t:0});
  }
  updateHud();
}
function killPlayer(){
  const p = player;
  if (!p) return;
  p.alive = false; player = null;
  boom(p.x + 8, p.y + 8, true);
  sfx.bigBoom(); buzz(90);
  lives--; playerLevel = Math.max(0, playerLevel - 1);
  if (lives > 0) respawnT = 80; else triggerGameOver();
  updateHud();
}
function destroyBase(){
  baseAlive = false;
  boom(BASE.x + 8, BASE.y + 8, true);
  sfx.baseDown(); buzz([60, 40, 140]);
  triggerGameOver();
}
function triggerGameOver(){ if (!gameOverPending){ gameOverPending = true; gameOverT = 0; } }
function spawnPlayer(){ sparkles.push({x:P_SPAWN.x, y:P_SPAWN.y, t:0, player:true}); }
function spawnPowerup(){
  const type = POWERS[rand(POWERS.length)];
  let pos = {x:96, y:96};
  for (let i = 0; i < 40; i++){
    const x = rand(25) * 8, y = rand(25) * 8;
    if (y >= 168 && x >= 72 && x <= 128) continue;
    let bad = false;
    for (let cy = y / T; cy < y / T + 4 && !bad; cy++) for (let cx = x / T; cx < x / T + 4; cx++){
      const v = cell(cx, cy);
      if (v === STEEL || v === WATER){ bad = true; break; }
    }
    if (!bad){ pos = {x, y}; break; }
  }
  powerup = {type, x:pos.x, y:pos.y, timer:900};
  sfx.appear();
}
function takePower(p){
  switch (p.type){
    case 'shield': player.shield = 600; break;
    case 'clock':  freezeT = 600; break;
    case 'shovel': shovelT = 1080; setBaseWall(STEEL); break;
    case 'star':   playerLevel = Math.min(3, playerLevel + 1); break;
    case 'bomb':   for (const t of tanks) if (!t.isPlayer && t.alive) killEnemy(t, false); break;
    case 'life':   lives = Math.min(9, lives + 1); break;
  }
  addScore(500);
  popups.push({x:p.x + 8, y:p.y + 8, text:'500', t:18});
  powerup = null;
  sfx.pick();
  updateHud();
}
function updateSpawns(){
  if (!queue.length) return;
  if (spawnTimer > 0){ spawnTimer--; return; }
  const onField = tanks.filter(t => !t.isPlayer && t.alive).length + sparkles.filter(s => !s.player).length;
  if (onField >= diff.maxOn) return;
  const sp = E_SPAWNS[spawnIdx % 3];
  spawnIdx++;
  if (tanks.some(t => t.alive && overlap(t.x, t.y, 16, 16, sp.x, sp.y, 16, 16)) || sparkles.some(s => s.x === sp.x && s.y === sp.y)){
    spawnTimer = 12; return;
  }
  enemyCount++;
  sparkles.push({x:sp.x, y:sp.y, t:0, player:false, type:queue.shift(), bonus:BONUS_AT.includes(enemyCount)});
  spawnTimer = enemyCount < 3 ? 25 : diff.interval;
  updateHud();
}
function updateSparkles(){
  for (const s of sparkles){
    s.t++;
    if (s.t < 48) continue;
    if (tanks.some(t => t.alive && overlap(t.x, t.y, 16, 16, s.x, s.y, 16, 16))) continue;
    s.done = true;
    if (s.player){ player = makePlayer(); tanks.push(player); }
    else tanks.push(makeEnemy(s.type, s.x, s.y, s.bonus));
  }
  sparkles = sparkles.filter(s => !s.done);
}
function lined(e, tx, ty){
  const ex = e.x + 8, ey = e.y + 8, cx = tx + 8, cy = ty + 8;
  switch (e.dir){
    case 0: return Math.abs(ex - cx) < 8 && cy < ey;
    case 2: return Math.abs(ex - cx) < 8 && cy > ey;
    case 1: return Math.abs(ey - cy) < 8 && cx > ex;
    default: return Math.abs(ey - cy) < 8 && cx < ex;
  }
}
function aimed(e){ return (player && player.alive && lined(e, player.x, player.y)) || (baseAlive && lined(e, BASE.x, BASE.y)); }
function chooseDir(e){
  const toward = (tx, ty) => {
    const dx = tx - e.x, dy = ty - e.y;
    if (Math.abs(dx) < 4) return dy > 0 ? 2 : 0;
    if (Math.abs(dy) < 4) return dx > 0 ? 1 : 3;
    return Math.random() < .5 ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  };
  const r = Math.random();
  let d;
  if (r < .4) d = toward(BASE.x, BASE.y);
  else if (r < .6 && player && player.alive) d = toward(player.x, player.y);
  else d = rand(4);
  if (e.stuck > 0 && d === e.dir) d = (d + 1 + rand(3)) % 4;
  turn(e, d);
}
function updateEnemy(e){
  if (e.hitFlash > 0) e.hitFlash--;
  if (freezeT > 0) return;
  if (e.fireCd > 0) e.fireCd--;
  const moved = tryMove(e, e.dir);
  if (moved){ e.animTick++; e.stuck = 0; } else e.stuck++;
  e.aiTimer--;
  if (e.aiTimer <= 0 || e.stuck > 24 || (e.stuck > 0 && Math.random() < .06)){
    chooseDir(e); e.aiTimer = 40 + rand(150);
  }
  if (canFire(e)){
    let p = .007 * diff.fire;
    if (aimed(e)) p = .05; else if (e.stuck > 0) p = .04 * diff.fire;
    if (Math.random() < p){ fire(e); e.fireCd = 45 + rand(50); }
  }
}
function updatePlayer(wantFire){
  const p = player;
  if (p.shield > 0) p.shield--;
  if (p.fireCd > 0) p.fireCd--;
  if (gameOverPending) return;
  const d = inputDir();
  if (d !== null && tryMove(p, d)) p.animTick++;
  if (wantFire && canFire(p)) fire(p);
}

/* ---------- flusso ---------- */
function newGame(){ score = 0; lives = 4; stageNum = 1; playerLevel = 0; newRecord = false;
  nextLife = LIFE_FIRST; lifeGap = LIFE_FIRST;
  startStage(); }
function startStage(){
  tanks = []; bullets = []; booms = []; popups = []; sparkles = []; player = null; powerup = null;
  freezeT = 0; shovelT = 0; respawnT = 0; clearT = 0; baseAlive = true; gameOverPending = false; gameOverT = 0;
  kills = {basic:0, fast:0, power:0, armor:0};
  const n = stageNum;
  diff = {spd:1 + Math.min(.22, .022 * (n - 1)), fire:1 + Math.min(.6, .05 * (n - 1)), interval:Math.max(105, 190 - (n - 1) * 8), maxOn:n >= 10 ? 5 : 4};
  queue = makeRoster(n); spawnIdx = 0; spawnTimer = 0; enemyCount = 0;
  loadMap(n - 1);
  setState('intro');
  showOverlay('intro');
  sfx.start();
  updateHud();
}
function nextStage(){ stageNum++; startStage(); }
function toTally(){ setState('tally'); updateHud(); showOverlay('tally'); sfx.pick(); }
function endGame(){
  if (score > hi){ hi = score; newRecord = true; store.set('bastione-hi', String(hi)); }
  setState('gameover'); showOverlay('gameover'); sfx.over();
}
function setState(s){ state = s; stateT = 0; updateTopBtns(); }
function togglePause(){
  if (state === 'playing'){ setState('paused'); showOverlay('pause'); sfx.pause(); }
  else if (state === 'paused'){ setState('playing'); hideOverlay(); sfx.pause(); }
}
function pauseIfPlaying(){ if (state === 'playing') togglePause(); }
function pressAdvance(src){
  if (state === 'title') newGame();
  else if (state === 'gameover' && stateT > 40) newGame();
  else if (state === 'tally' && stateT > 40) nextStage();
  else if (src === 'enter' && (state === 'playing' || state === 'paused')) togglePause();
  else if (src === 'tap' && state === 'paused') togglePause();
}

function tick(){
  frame++; stateT++;
  if (state === 'intro'){ if (stateT >= 110){ setState('playing'); hideOverlay(); spawnPlayer(); } return; }
  if (state === 'tally'){ if (stateT >= 600) nextStage(); return; }
  if (state !== 'playing') return;
  const wantFire = keyFire || touchFire || fireLatch || autoFire;
  fireLatch = false;
  if (respawnT > 0 && --respawnT === 0 && !gameOverPending) spawnPlayer();
  if (!gameOverPending) updateSpawns();
  updateSparkles();
  if (player && player.alive) updatePlayer(wantFire);
  for (const t of tanks) if (!t.isPlayer && t.alive) updateEnemy(t);
  updateBullets();
  tanks = tanks.filter(t => t.alive);
  if (powerup){
    if (--powerup.timer <= 0) powerup = null;
    else if (player && player.alive && overlap(player.x, player.y, 16, 16, powerup.x, powerup.y, 16, 16)) takePower(powerup);
  }
  if (freezeT > 0) freezeT--;
  if (shovelT > 0){
    shovelT--;
    if (shovelT === 0) setBaseWall(BRICK);
    else if (shovelT < 180 && shovelT % 16 === 0) setBaseWall((shovelT / 16) % 2 ? BRICK : STEEL);
  }
  for (const b of booms) b.t++;
  booms = booms.filter(b => b.t < b.dur);
  for (const p of popups) p.t++;
  popups = popups.filter(p => p.t < 70);
  if (gameOverPending){ if (++gameOverT >= 170) endGame(); }
  else if (!queue.length && !sparkles.some(s => !s.player) && !tanks.some(t => !t.isPlayer)){
    if (++clearT >= 150) toTally();
  }
}

/* ---------- disegno ---------- */
function palKeyFor(t){
  if (t.hitFlash > 0) return 'flash';
  if (t.isPlayer) return 'player';
  if (t.bonus && ((frame >> 3) & 1)) return 'bonus';
  if (t.type === 'armor') return 'armor' + Math.max(1, Math.min(4, t.hp));
  return 'enemy';
}
function drawTank(c, t){
  const x = Math.round(t.x), y = Math.round(t.y), r = ROT[t.dir];
  const shapeKey = t.isPlayer ? ('p' + Math.min(3, playerLevel)) : t.type;
  c.save();
  c.translate(x + 8, y + 8); c.transform(r[0], r[1], r[2], r[3], 0, 0);
  c.drawImage(sprite(shapeKey, palKeyFor(t), (t.animTick >> 3) & 1), -8, -8);
  c.restore();
}
function drawShield(t){
  const x = Math.round(t.x) - 1, y = Math.round(t.y) - 1, ph = (frame >> 1) & 1;
  ctx.fillStyle = ph ? '#c8f5ff' : '#5fd3f5';
  for (let i = ph; i < 18; i += 2){
    ctx.fillRect(x + i, y, 1, 1); ctx.fillRect(x + 17 - i, y + 17, 1, 1);
    ctx.fillRect(x, y + 17 - i, 1, 1); ctx.fillRect(x + 17, y + i, 1, 1);
  }
}
function drawSparkle(s){
  const cx = s.x + 8, cy = s.y + 8, k = [1,2,3,4,3,2][(s.t >> 2) % 6];
  ctx.fillStyle = '#9fe7ff';
  ctx.fillRect(cx - 1, cy - k * 2, 2, k * 4); ctx.fillRect(cx - k * 2, cy - 1, k * 4, 2);
  if (k >= 3){ ctx.fillRect(cx - k, cy - k, 1, 1); ctx.fillRect(cx + k - 1, cy - k, 1, 1); ctx.fillRect(cx - k, cy + k - 1, 1, 1); ctx.fillRect(cx + k - 1, cy + k - 1, 1, 1); }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - 1, cy - k, 2, k * 2); ctx.fillRect(cx - k, cy - 1, k * 2, 2);
}
function disc(cx, cy, r, col){
  ctx.fillStyle = col;
  for (let dy = -r; dy <= r; dy++){ const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(cx - w, cy + dy, 2 * w + 1, 1); }
}
function drawBoom(e){
  const p = e.t / e.dur, cx = Math.round(e.x), cy = Math.round(e.y);
  const R = e.big ? Math.round(3 + 13 * Math.sin(Math.PI * Math.min(1, p * 1.15))) : [3,5,6,5,3,2][Math.min(5, Math.floor(p * 6))];
  disc(cx, cy, R, '#e8542c'); disc(cx, cy, Math.round(R * .68), '#ffc23a'); disc(cx, cy, Math.max(1, Math.round(R * .34)), '#fff7e0');
  if (e.big && p < .7){
    ctx.fillStyle = '#ffc23a';
    for (let i = 0; i < 8; i++){
      const ang = i * Math.PI / 4 + e.seed, d = R + 2 + p * 8;
      ctx.fillRect(Math.round(cx + Math.cos(ang) * d) - 1, Math.round(cy + Math.sin(ang) * d) - 1, 2, 2);
    }
  }
}
function render(){
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, W);
  ctx.drawImage(waterLayers[(frame >> 5) & 1], 0, 0);
  if (terrainDirty) redrawTerrain();
  ctx.drawImage(terrainLayer, 0, 0);
  ctx.drawImage(baseAlive ? baseImg : baseDeadImg, BASE.x, BASE.y);
  for (const s of sparkles) drawSparkle(s);
  for (const t of tanks) drawTank(ctx, t);
  for (const t of tanks) if (t.isPlayer && t.shield > 0) drawShield(t);
  for (const b of bullets){
    const r = ROT[b.dir];
    ctx.save();
    ctx.translate(Math.round(b.x), Math.round(b.y));
    ctx.transform(r[0], r[1], r[2], r[3], 0, 0);
    ctx.drawImage(splashImg(b.isPlayer), -4, -4);
    ctx.restore();
  }
  ctx.drawImage(forestLayer, 0, 0);
  if (powerup && (powerup.timer > 180 ? ((frame >> 4) % 4 !== 3) : ((frame >> 2) % 2 === 0)))
    ctx.drawImage(powerImgs[powerup.type], powerup.x, powerup.y);
  for (const e of booms) drawBoom(e);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups){
    if (p.t < (p.big ? 0 : 18)) continue;
    if (p.big && (p.t >> 2) % 5 === 4) continue;           // lampeggia
    ctx.font = '700 ' + (p.big ? 11 : 7) + 'px Silkscreen, "Courier New", monospace';
    ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x + 1, p.y + 1);
    ctx.fillStyle = p.big ? '#f2d16b' : '#ffffff'; ctx.fillText(p.text, p.x, p.y);
  }
  if (gameOverPending && state === 'playing'){
    const y = W + 12 - Math.min(1, gameOverT / 90) * (W / 2 + 12);
    ctx.font = '700 16px Silkscreen, "Courier New", monospace';
    ctx.fillStyle = '#000'; ctx.fillText('Game over', W / 2 + 1, y + 1);
    ctx.fillStyle = '#e5473b'; ctx.fillText('Game over', W / 2, y);
  }
}

/* ---------- input ---------- */
const KEYDIR = {ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3};
const FIREKEYS = new Set(['Space', 'KeyJ', 'KeyK', 'KeyZ', 'KeyX']);
let dirStack = [], keyFire = false, touchFire = false, fireLatch = false, touchDir = null;
function inputDir(){ return dirStack.length ? KEYDIR[dirStack[dirStack.length - 1]] : touchDir; }

addEventListener('keydown', e => {
  sfx.init();
  if (e.code in KEYDIR){ e.preventDefault(); if (!dirStack.includes(e.code)) dirStack.push(e.code); return; }
  if (FIREKEYS.has(e.code)){ e.preventDefault(); keyFire = true; if (!e.repeat){ fireLatch = true; pressAdvance('fire'); } return; }
  if (e.code === 'Enter'){ e.preventDefault(); if (!e.repeat) pressAdvance('enter'); return; }
  if (e.code === 'KeyP' || e.code === 'Escape'){ e.preventDefault(); togglePause(); return; }
  if (e.code === 'KeyM'){ toggleMute(); return; }
  if (e.code === 'KeyF' && !e.repeat) toggleAuto();
});
addEventListener('keyup', e => {
  if (e.code in KEYDIR) dirStack = dirStack.filter(c => c !== e.code);
  if (FIREKEYS.has(e.code)) keyFire = false;
});
function releaseAll(){ dirStack = []; keyFire = false; touchFire = false; stickId = null; org = null; delete zone.dataset.on; setStick(null, 0, 0); restStick(); $('#fire').classList.remove('down'); }
addEventListener('blur', () => { releaseAll(); pauseIfPlaying(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ releaseAll(); pauseIfPlaying(); } });
addEventListener('pointerdown', () => sfx.init(), {capture:true});

const zone = $('#stickZone'), stick = $('#stick');
let stickId = null, org = null, stickW = 0;
const KNOB_TRAVEL = .15, DEAD_ZONE = .05, HYST = 1.35;
function setStick(d, kx, ky){
  touchDir = d;
  zone.dataset.dir = d === null ? '' : String(d);
  zone.style.setProperty('--kx', kx.toFixed(1) + 'px');
  zone.style.setProperty('--ky', ky.toFixed(1) + 'px');
}
function placeStick(x, y){
  zone.style.setProperty('--sx', x.toFixed(1) + 'px');
  zone.style.setProperty('--sy', y.toFixed(1) + 'px');
}
function restStick(){
  const r = zone.getBoundingClientRect();
  if (r.width) placeStick(r.width / 2, r.height / 2);
}
function stickAt(e){
  const dx = e.clientX - org.x, dy = e.clientY - org.y;
  const dist = Math.hypot(dx, dy), max = stickW * KNOB_TRAVEL;
  const k = dist > max ? max / dist : 1;
  if (dist < stickW * DEAD_ZONE){ setStick(null, dx * k, dy * k); return; }
  const ax = Math.abs(dx), ay = Math.abs(dy), cur = touchDir;
  const horiz = cur === 1 || cur === 3 ? ax * HYST > ay
              : cur === 0 || cur === 2 ? ax > ay * HYST
              : ax > ay;
  setStick(horiz ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0), dx * k, dy * k);
}
zone.addEventListener('pointerdown', e => {
  e.preventDefault(); stickId = e.pointerId; zone.dataset.on = '1';
  try { zone.setPointerCapture(e.pointerId); } catch(_){}
  const r = zone.getBoundingClientRect();
  stickW = stick.offsetWidth || r.width;
  // la levetta nasce sotto il pollice, trattenuta dentro lo schermo
  const m = stickW * .5;
  const cx = Math.max(m, Math.min(e.clientX, innerWidth - m));
  const cy = Math.max(m, Math.min(e.clientY, innerHeight - m));
  org = {x:cx, y:cy};
  placeStick(cx - r.left, cy - r.top);
  stickAt(e);
});
zone.addEventListener('pointermove', e => { if (e.pointerId === stickId && org) stickAt(e); });
const stickEnd = e => {
  if (e.pointerId !== stickId) return;
  stickId = null; org = null; delete zone.dataset.on; setStick(null, 0, 0); restStick();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => zone.addEventListener(ev, stickEnd));

const fireBtn = $('#fire');
fireBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); touchFire = true; fireLatch = true; fireBtn.classList.add('down');
  try { fireBtn.setPointerCapture(e.pointerId); } catch(_){}
  pressAdvance('fire');
});
const fireEnd = () => { touchFire = false; fireBtn.classList.remove('down'); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => fireBtn.addEventListener(ev, fireEnd));
[zone, fireBtn].forEach(el => el.addEventListener('contextmenu', e => e.preventDefault()));

overlay.addEventListener('click', e => {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  pressAdvance('tap');
});
btnPause.addEventListener('click', () => { togglePause(); btnPause.blur(); });
function toggleMute(){ muted = !muted; store.set('bastione-mute', muted ? '1' : '0'); if (!muted) sfx.init(); updateTopBtns(); }
btnMute.addEventListener('click', () => { toggleMute(); btnMute.blur(); });
function toggleAuto(){ autoFire = !autoFire; store.set('bastione-auto', autoFire ? '1' : '0'); updateTopBtns(); if (state === 'title') showOverlay('title'); }
btnAuto.addEventListener('click', () => { toggleAuto(); btnAuto.blur(); });

/* ---------- avvio ---------- */
document.body.classList.toggle('touch', isTouch);
addEventListener('touchstart', () => { if (!document.body.classList.contains('touch')){ document.body.classList.add('touch'); layout(); } }, {passive:true, once:true});
loadMap(0);
showOverlay('title');
updateHud(); updateTopBtns();
layout();
if (window.ResizeObserver) new ResizeObserver(layout).observe($('#fieldArea'));
else addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5){ tick(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
